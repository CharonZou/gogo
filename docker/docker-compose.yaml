# gogo Production Environment
# Usage: make up
#
# Services:
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server (Dockerfile generated by langgraph dockerfile)
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   gogo_HOME                   — runtime data dir, default $REPO_ROOT/backend/.gogo
#   gogo_CONFIG_PATH            — path to config.yaml
#   gogo_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   gogo_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   gogo_REPO_ROOT              — repo root (used for skills host path in DooD)
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:8001 (Gateway), http://localhost:2024 (LangGraph)

services:
  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
    container_name: gogo-gateway
    # Workers default to 4 (override via gogo_GATEWAY_WORKERS in .env).
    # More workers = more process-level isolation: if one worker's event loop
    # stalls on a slow graph run, the others keep serving /health and fast
    # routes. Keep >= 4 in production.
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${gogo_GATEWAY_WORKERS:-4} --timeout-keep-alive 30"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${gogo_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${gogo_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${gogo_HOME}:/app/backend/.gogo
      # DooD: AioSandboxProvider starts sandbox containers via host Docker daemon
      - ${gogo_DOCKER_SOCKET}:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + runtime CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - gogo_HOME=/app/backend/.gogo
      - gogo_CHANNELS_LANGGRAPH_URL=${gogo_CHANNELS_LANGGRAPH_URL:-http://langgraph:2024}
      - gogo_CHANNELS_GATEWAY_URL=${gogo_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      # DooD path/network translation
      - gogo_HOST_BASE_DIR=${gogo_HOME}
      - gogo_HOST_SKILLS_PATH=${gogo_REPO_ROOT}/skills
      - gogo_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gogo
    restart: unless-stopped

  # ── LangGraph Server ───────────────────────────────────────────────────────
  # TODO: switch to langchain/langgraph-api (licensed) once a license key is available.
  # For now, use `langgraph dev` (no license required) with the standard backend image.
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
    container_name: gogo-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    ports:
      - "127.0.0.1:2024:2024"
    ports:
      - "127.0.0.1:2024:2024"
    volumes:
      - ${gogo_CONFIG_PATH}:/app/config.yaml:ro
      - ${gogo_EXTENSIONS_CONFIG_PATH}:/app/extensions_config.json:ro
      - ${gogo_HOME}:/app/backend/.gogo
      - ../skills:/app/skills:ro
      - ../backend/.langgraph_api:/app/backend/.langgraph_api
      # DooD: same as gateway
      - ${gogo_DOCKER_SOCKET}:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + runtime CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    environment:
      - CI=true
      - gogo_HOME=/app/backend/.gogo
      - gogo_CONFIG_PATH=/app/config.yaml
      - gogo_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - gogo_HOST_BASE_DIR=${gogo_HOME}
      - gogo_HOST_SKILLS_PATH=${gogo_REPO_ROOT}/skills
      - gogo_SANDBOX_HOST=host.docker.internal
      # Disable LangSmith tracing — LANGSMITH_API_KEY is not required.
      # Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable.
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gogo
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: gogo-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=gogo
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${gogo_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${gogo_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gogo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  gogo:
    driver: bridge
