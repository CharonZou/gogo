[project]
name = "rocheflow"
version = "0.4.0"
description = "RocheFlow — 无头智能体引擎（Agent Engine）：编排 / 沙箱 / 记忆 / 技能 / MCP / 调度"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "networkx>=3.3",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "docker>=7.1",
    "playwright>=1.47",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
